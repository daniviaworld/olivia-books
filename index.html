<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olivia Books</title>
<meta name="description" content="Los libros de Olivia: escribe, lee y comparte con la familia.">
<meta name="theme-color" content="#4a2fc4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<style>
#splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;
  padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);background:radial-gradient(120% 90% at 50% 12%,#7c4dff 0%,#4a2fc4 52%,#2a1b7a 100%);color:#fff;cursor:pointer;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:opacity .6s ease,transform .6s ease}
#splash::before{content:"";position:absolute;inset:auto -20% -30% -20%;height:55%;background:radial-gradient(60% 60% at 50% 100%,#ff5fa2aa,transparent 70%);animation:spGlow 3s ease-in-out infinite alternate}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
#splash .sp-st{position:absolute;inset:0;pointer-events:none}
#splash .sp-st i{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);background:#fff;opacity:0;
  clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:spTw 2.6s ease-in-out var(--d) infinite}
#splash .sp-book{position:relative;width:min(64vw,250px);aspect-ratio:240/180;animation:spPop .9s cubic-bezier(.2,1.3,.3,1) both,spFloat 3.4s ease-in-out .9s infinite}
#splash .sp-book::before{content:"";position:absolute;inset:-18%;background:radial-gradient(closest-side,#ffd54f66,transparent);animation:spGlow 2.2s ease-in-out infinite alternate}
#splash svg{position:relative;width:100%;height:100%;overflow:visible}
#splash .fl{transform-box:view-box;transform-origin:120px 100px;animation:spFlip 2.4s ease-in-out infinite;opacity:0}
#splash .f2{animation-delay:.45s}#splash .f3{animation-delay:.9s}
#splash .sp-sp{transform-box:fill-box;transform-origin:center;animation:spSpark 2s ease-in-out infinite}
#splash .sp-sp.b{animation-delay:.6s}#splash .sp-sp.c{animation-delay:1.1s}
#splash h1{margin:6px 0 0;font-size:clamp(2rem,9vw,3rem);font-weight:800;letter-spacing:.01em;display:flex;flex-wrap:wrap;justify-content:center;text-shadow:0 6px 24px #1b0f5c88}
#splash h1 span{display:inline-block;opacity:0;transform:translateY(22px) scale(.8);animation:spRise .7s cubic-bezier(.2,1.4,.4,1) calc(.5s + var(--i)*.07s) forwards}
#splash h1 .sp{width:.35em}
#splash p{margin:0;font-size:clamp(1rem,4.2vw,1.2rem);opacity:0;animation:spFade .8s ease 1.5s forwards;text-align:center;color:#fff4d6}
#splash .sp-dots{display:flex;gap:8px;margin-top:18px;opacity:0;animation:spFade .6s ease 1.7s forwards}
#splash .sp-dots i{width:9px;height:9px;border-radius:50%;background:#fff;animation:spDot 1s ease-in-out infinite}
#splash .sp-dots i:nth-child(2){animation-delay:.15s}#splash .sp-dots i:nth-child(3){animation-delay:.3s}
#splash .sp-skip{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));font-size:.8rem;opacity:.55}
@keyframes spPop{from{opacity:0;transform:scale(.3) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes spFloat{50%{transform:translateY(-8px) rotate(.8deg)}}
@keyframes spFlip{0%{transform:scaleX(1);opacity:1}45%{transform:scaleX(.03);opacity:1}46%{transform:scaleX(-.03)}85%{transform:scaleX(-1);opacity:1}100%{transform:scaleX(-1);opacity:0}}
@keyframes spSpark{0%,100%{transform:scale(.4) rotate(0);opacity:.2}50%{transform:scale(1.15) rotate(40deg);opacity:1}}
@keyframes spRise{to{opacity:1;transform:none}}
@keyframes spFade{to{opacity:1}}
@keyframes spDot{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-7px);opacity:1}}
@keyframes spTw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:.85;transform:scale(1)}}
@keyframes spGlow{from{opacity:.55}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#splash *,#splash::before{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}#splash h1 span,#splash p,#splash .sp-dots{opacity:1;transform:none}}
</style>

</head>
<body>
<div id="splash" aria-hidden="true"><div class="sp-st"><i style="--x:8%;--y:12%;--s:14px;--d:0.0s"></i><i style="--x:86%;--y:9%;--s:18px;--d:0.7s"></i><i style="--x:18%;--y:34%;--s:10px;--d:1.4s"></i><i style="--x:78%;--y:30%;--s:12px;--d:0.3s"></i><i style="--x:6%;--y:62%;--s:16px;--d:1.0s"></i><i style="--x:92%;--y:58%;--s:11px;--d:1.9s"></i><i style="--x:24%;--y:82%;--s:13px;--d:0.5s"></i><i style="--x:70%;--y:84%;--s:17px;--d:1.2s"></i><i style="--x:48%;--y:6%;--s:10px;--d:2.0s"></i><i style="--x:55%;--y:92%;--s:12px;--d:0.2s"></i><i style="--x:35%;--y:20%;--s:9px;--d:1.7s"></i><i style="--x:63%;--y:18%;--s:9px;--d:0.9s"></i></div>
<div class="sp-book"><svg viewBox="0 0 240 180" aria-hidden="true">
  <ellipse cx="120" cy="158" rx="92" ry="9" fill="#1b0f5c" opacity=".35"/>
  <path d="M14 66 Q68 50 120 70 Q172 50 226 66 L226 146 Q172 130 120 152 Q68 130 14 146 Z" fill="#2a1b7a"/>
  <path d="M24 64 Q70 54 120 72 L120 140 Q70 124 24 134 Z" fill="#fff"/>
  <path d="M216 64 Q170 54 120 72 L120 140 Q170 124 216 134 Z" fill="#eee7ff"/>
  <path d="M120 72 L120 140" stroke="#cbbcff" stroke-width="2"/>
  <path d="M38 80 Q70 74 106 88 M38 94 Q70 88 106 102 M38 108 Q70 102 106 116" stroke="#d9ccff" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M134 88 Q170 74 202 80 M134 102 Q170 88 202 94" stroke="#d9ccff" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M184 62 L184 98 L192 90 L200 98 L200 64 Z" fill="#ff5c8a"/>
  <g class="fl f1"><path d="M120 72 Q170 54 216 64 L216 134 Q170 124 120 140 Z" fill="#fff" stroke="#e3d9ff" stroke-width="2"/><path d="M138 92 Q170 80 200 86 M138 106 Q170 94 200 100" stroke="#e1d6ff" stroke-width="4" stroke-linecap="round" fill="none"/></g>
  <g class="fl f2"><path d="M120 72 Q170 54 216 64 L216 134 Q170 124 120 140 Z" fill="#fffaf0" stroke="#e3d9ff" stroke-width="2"/><path d="M138 92 Q170 80 200 86 M138 106 Q170 94 200 100" stroke="#f0e2c8" stroke-width="4" stroke-linecap="round" fill="none"/></g>
  <g class="fl f3"><path d="M120 72 Q170 54 216 64 L216 134 Q170 124 120 140 Z" fill="#fff" stroke="#e3d9ff" stroke-width="2"/><path d="M138 92 Q170 80 200 86 M138 106 Q170 94 200 100" stroke="#e1d6ff" stroke-width="4" stroke-linecap="round" fill="none"/></g>
  <path class="sp-sp" d="M120 6 L128 26 L148 34 L128 42 L120 62 L112 42 L92 34 L112 26 Z" fill="#ffd54f"/>
  <path class="sp-sp b" d="M184 18 L188 28 L198 32 L188 36 L184 46 L180 36 L170 32 L180 28 Z" fill="#ff9ccf"/>

</svg></div>
<h1><span style="--i:0">O</span><span style="--i:1">l</span><span style="--i:2">i</span><span style="--i:3">v</span><span style="--i:4">i</span><span style="--i:5">a</span><span class="sp" style="--i:6"></span><span style="--i:7">B</span><span style="--i:8">o</span><span style="--i:9">o</span><span style="--i:10">k</span><span style="--i:11">s</span></h1>
<p>Donde viven las historias ✨</p>
<div class="sp-dots"><i></i><i></i><i></i></div>
<small class="sp-skip">Toca para entrar</small></div>
<script>
(function(){var s=document.getElementById('splash');if(!s)return;
var seen=false;try{seen=sessionStorage.getItem('ob-splash')==='1'}catch(e){}
if(seen){s.remove();return}
try{sessionStorage.setItem('ob-splash','1')}catch(e){}
var t0=Date.now(),done=false,min=(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)?900:2300;
function bye(){if(done)return;done=true;s.classList.add('out');setTimeout(function(){s.remove()},650)}
s.addEventListener('click',bye);
function check(){var a=document.getElementById('app'),ready=a&&a.children.length>0&&!a.querySelector('.spinner'),dt=Date.now()-t0;
if((dt>=min&&ready)||dt>7000)bye();else setTimeout(check,150)}
check();})();
</script>
<div id="app"></div>
<div id="print-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
<noscript>Olivia Books necesita JavaScript.</noscript>
</body>
</html>
